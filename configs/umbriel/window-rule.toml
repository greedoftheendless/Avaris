# Window and layer rules (see docs/user/rules.md)
[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^zen-beta$"
default_workspace = 1
default_maximize = true

[[window_rule]]
match.app_id = "^vesktop$"
default_workspace = 1
default_floating = false
default_maximize_to_edges = true

[[window_rule]]
match.app_id = "^(spotify|Spotify)$"
default_workspace = 1
default_maximize_to_edges = true

[[window_rule]]
match.app_id = "steam"
default_workspace = 3
default_maximize = true
