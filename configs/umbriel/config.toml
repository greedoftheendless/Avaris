[include]
files = [
  "./keybinds.toml",
  "./window-rule.toml",
  "./autostart-rules.toml",
  "./inputs.toml",
  "./appearance.toml",
  "./animation.toml",
]

[events]
lid_close = "notify-send 'The laptop lid is closed!'"
lid_open = "notify-send 'The laptop lid is open!'"

[environment]
QT_QPA_PLATFORMTHEME = "qt6ct"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
GTK_USE_PORTAL = "1"

[workspaces]
back_and_forth = true


[output.eDP-1]
mode = "1920x1080@60"
scale = 1.00

# Colors
[colors]

[colors.border]
focused = "#7AA3FFFF"
unfocused = "#292933FF"
outer = "#1A1A1FFF"

# Overview
[overview]
zoom = 0.4

# Layout ---------------------------------------------------------------------
[layout]
mode = "scrolling"             # "scrolling" or "dwindle"
gap = 5
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
center_underfull_strip = true
default_extent_fraction = 0.5
